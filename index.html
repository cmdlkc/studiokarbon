/* ---------- cubic-bezier easing (matches CSS) ---------- */
function bez(x1,y1,x2,y2){

  function slope(t,p1,p2){return 3*a(p1,p2)*t*t+2*b(p1,p2)*t+c(p1)}

    t=Math.min(1,Math.max(0,t));return calc(t,y1,y2);

}

var prog,loc={},tex,ok=!!gl;
function sh(type,s){var o=gl.createShader(type);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(o));ok=false;}return o;}
if(ok){
  prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))ok=false;
}
if(ok){
  gl.useProgram(prog);
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var al=gl.getAttribLocation(prog,"a");gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
  ["T","R","M","tm","sc","hv"].forEach(function(n){loc[n]=gl.getUniformLocation(prog,n);});
  tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
}
/* no WebGL: show the content canvas itself */
var flat=null;if(!ok){flat=cv.getContext("2d");}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.75);
  W=Math.round(innerWidth*DPR);H=Math.round(innerHeight*DPR);
  src.width=W;src.height=H;cv.width=W;cv.height=H;
  if(ok)gl.viewport(0,0,W,H);
}
addEventListener("resize",resize);resize();

/* ---------- input, smoothed slowly ---------- */
var mT=[.5,.42],mC=[.5,.42],hT=0,hC=0,sT=0,sC=0;
addEventListener("pointermove",function(e){mT=[e.clientX/innerWidth,e.clientY/innerHeight];hT=1;},{passive:true});
document.addEventListener("pointerleave",function(){hT=0;});
addEventListener("blur",function(){hT=0;});
addEventListener("wheel",function(e){sT+=e.deltaY*.0015;},{passive:true});
var ty0=null;
addEventListener("touchstart",function(e){ty0=e.touches[0].clientY;},{passive:true});
addEventListener("touchmove",function(e){if(ty0!==null){sT+=(ty0-e.touches[0].clientY)*.004;ty0=e.touches[0].clientY;}},{passive:true});

var start=performance.now(),last=start;
function frame(now){
  var t=(now-start)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
  var a=1-Math.exp(-dt*2.2);
  mC[0]+=(mT[0]-mC[0])*a;mC[1]+=(mT[1]-mC[1])*a;hC+=(hT-hC)*(1-Math.exp(-dt*1.5));sC+=(sT-sC)*(1-Math.exp(-dt*1.8));
  typeStep(t);
  drawContent(t,typed,reduce||Math.floor(t*2)%2===0||ti<TEXT.length&&dir>0);
  if(ok){
    gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.uniform1i(loc.T,0);gl.uniform2f(loc.R,W,H);gl.uniform2f(loc.M,mC[0],1-mC[1]);
    gl.uniform1f(loc.tm,reduce?0:t);gl.uniform1f(loc.sc,sC);gl.uniform1f(loc.hv,hC);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }else{flat.drawImage(src,0,0);}
  requestAnimationFrame(frame);
}
var go=function(){requestAnimationFrame(frame);};
if(document.fonts&&document.fonts.load){document.fonts.load('17px "Geist Serif"').then(go,go);}else go();
})();
</script>
</body>
